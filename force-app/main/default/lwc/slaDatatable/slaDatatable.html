<template>
  <div style="height: 300px">
    <lightning-card title="SLA Milestones">
      <!-- Spinner -->
      <template if:true={isLoading}>
        <lightning-spinner
          alternative-text="Loading"
          size="medium"
          variant="brand"
        >
        </lightning-spinner>
      </template>

      <!-- Datatable -->
      <c-custom-sla-table
        key-field="id"
        data={milestones}
        columns={columns}
        onrowaction={handleRowAction}
        hide-checkbox-column
      >
      </c-custom-sla-table>

      <div class="slds-align_absolute-center" style="height: 5rem">
        <!-- Refresh Button -->
        <lightning-button
          label="Refresh"
          onclick={handleRefresh}
        ></lightning-button>
      </div>
    </lightning-card>
  </div>
</template>
